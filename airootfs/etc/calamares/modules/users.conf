---
defaultGroups:
    - users
    - lp
    - video
    - network
    - storage
    - wheel
    - audio

autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReuseUserPasswordForRoot: false
passwordRequirements:
    minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: true
